name: Playwright API Tests

on:
  push:
    paths:
      - 'automated-testing/playwright-api-testing/**'
      - '.github/workflows/playwright-api-tests.yml'

  pull_request:
    paths:
      - 'automated-testing/playwright-api-testing/**'
      - '.github/workflows/playwright-api-tests.yml'

jobs:
  api-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: automated-testing/playwright-api-testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automated-testing/playwright-api-testing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test
